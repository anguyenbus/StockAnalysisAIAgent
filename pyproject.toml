[tool.poetry]
name = "your-project-name"
version = "0.1.0"
description = "Your project description"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
pylint = "^3.3.6"
markdown = "^3.7"
pandas = "^2.2.3"
yfinance = "^0.2.55"
flask = "^3.1.0"
numpy = "^2.2.4"
langchain = "^0.3.21"
langchain-openai = "^0.3.9"
langgraph = "^0.3.18"

[tool.poetry.group.dev.dependencies]
black = "^24.1.0"
flake8 = "^7.0.0"
pylint = "^3.0.3"
pre-commit = "^3.6.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 88
extend-ignore = "E203"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pylint]
max-line-length = 88
disable = [
    "C0111",  # missing-docstring (covered by function/class docstrings)
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
]
good-names = ["i", "j", "k", "ex", "Run", "id", "_"]
