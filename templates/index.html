<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analysis AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Load Plotly.js before your script -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>
    <div class="container py-5">
        <div class="row mb-4">
            <div class="col">
                <h1 class="text-center mb-4">Stock Analysis AI</h1>
                <p class="text-center">Powered by deepseek-r1:7b</p>
                <div class="card">
                    <div class="card-body">
                        <form id="analysisForm">
                            <div class="input-group mb-3">
                                <input type="text" id="stockSymbol" name="symbol" class="form-control"
                                    placeholder="Enter stock symbol (e.g., AAPL, MSFT, GOOGL)" required>
                                <button type="submit" class="btn btn-primary">Analyze</button>
                            </div>
                            <div class="form-text">Enter a valid stock symbol. US stocks work best.</div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="loadingIndicator" class="text-center py-5 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Analyzing stock data. This may take a moment...</p>
        </div>

        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <div id="analysisResults" class="d-none">
            <!-- Price Summary Card -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card h-100" id="priceSummary">
                        <div class="card-body">
                            <h5 class="card-title">Price Summary</h5>
                            <div class="d-flex align-items-baseline">
                                <h2 id="currentPrice" class="me-2">$0.00</h2>
                                <span id="priceChange" class="badge"></span>
                            </div>
                            <div id="miniChart" style="height: 100px;"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="card-title mb-0">Price History</h5>
                                <div class="btn-group" role="group" aria-label="Time period">
                                    <button type="button" class="btn btn-outline-secondary period-btn"
                                        data-period="1mo">1M</button>
                                    <button type="button" class="btn btn-outline-secondary period-btn active"
                                        data-period="6mo">6M</button>
                                    <button type="button" class="btn btn-outline-secondary period-btn"
                                        data-period="1y">1Y</button>
                                    <button type="button" class="btn btn-outline-secondary period-btn"
                                        data-period="5y">5Y</button>
                                </div>
                            </div>
                            <div id="candlestickChart" style="height: 300px;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Analysis Tabs -->
            <div class="card">
                <div class="card-header bg-white">
                    <ul class="nav nav-tabs card-header-tabs" id="analysisTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="recommendation-tab" data-bs-toggle="tab"
                                data-bs-target="#recommendation" type="button" role="tab">Recommendation</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="technical-tab" data-bs-toggle="tab" data-bs-target="#technical"
                                type="button" role="tab">Technical Analysis</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="market-tab" data-bs-toggle="tab" data-bs-target="#market"
                                type="button" role="tab">Market Analysis</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="news-tab" data-bs-toggle="tab" data-bs-target="#news"
                                type="button" role="tab">News Analysis</button>
                        </li>
                    </ul>
                </div>
                <div class="card-body">
                    <div class="tab-content" id="analysisTabContent">
                        <div class="tab-pane fade show active" id="recommendation" role="tabpanel">
                            <div id="recommendationContent" class="analysis-content"></div>
                        </div>
                        <div class="tab-pane fade" id="technical" role="tabpanel">
                            <div id="technicalContent" class="analysis-content"></div>
                        </div>
                        <div class="tab-pane fade" id="market" role="tabpanel">
                            <div id="marketContent" class="analysis-content"></div>
                        </div>
                        <div class="tab-pane fade" id="news" role="tabpanel">
                            <div id="newsContent" class="analysis-content"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
